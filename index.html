<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="BizEnglish">
<link rel="manifest" href="manifest.json">
<title>BizEnglish Coach — SAP SF 商务英语听说训练</title>
<style>
  :root{
    --bg:#f7f8fa; --surface:#ffffff; --surface-2:#f0f2f5;
    --text:#1a2233; --text-2:#5a6478; --muted:#9aa3b2;
    --border:#e4e8ee; --border-strong:#d4dae3;
    --primary:#2563eb; --primary-soft:#e8f0fe; --primary-dark:#1d4ed8;
    --success:#0f9d58; --success-soft:#e6f4ea;
    --warn:#e8830c; --warn-soft:#fdf0e0;
    --error:#d93025; --error-soft:#fce8e6;
    --accent:#7c3aed; --accent-soft:#f1ebfd; --accent-dark:#6d28d9;
    --radius:14px; --radius-sm:9px; --radius-pill:100px;
    --font:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Roboto,sans-serif;
    --mono:'SF Mono',Consolas,monospace;
    --shadow:0 1px 3px rgba(20,30,50,.06),0 4px 16px rgba(20,30,50,.05);
    --shadow-lg:0 8px 30px rgba(20,30,50,.12);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);font-family:var(--font);color:var(--text);line-height:1.55;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer;border:none;background:none}
  .app{max-width:920px;margin:0 auto;padding:20px 18px 60px}

  /* ===== Header ===== */
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
  .brand{display:flex;align-items:center;gap:11px}
  .logo{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,var(--primary),var(--accent));display:grid;place-items:center;color:#fff;font-size:20px;box-shadow:var(--shadow)}
  .brand h1{font-size:17px;font-weight:700;letter-spacing:-.2px}
  .brand p{font-size:12px;color:var(--text-2);margin-top:1px}
  .streak{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-pill);padding:6px 13px;font-size:13px;font-weight:600;box-shadow:var(--shadow)}
  .streak .fire{font-size:15px}

  /* ===== Cards ===== */
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  .section-label{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin:22px 4px 11px}
  .section-label:first-of-type{margin-top:6px}

  /* ===== Accent chip selectors ===== */
  .chips{display:flex;flex-wrap:wrap;gap:9px}
  .chip{display:flex;align-items:center;gap:8px;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius-pill);padding:9px 15px;font-size:14px;font-weight:600;color:var(--text-2);transition:all .16s ease}
  .chip .flag{font-size:17px}
  .chip:hover{border-color:var(--border-strong);transform:translateY(-1px)}
  .chip.active{background:var(--primary-soft);border-color:var(--primary);color:var(--primary-dark)}
  .chip .diff{font-size:10px;font-weight:700;padding:2px 7px;border-radius:var(--radius-pill);background:var(--surface-2);color:var(--muted)}
  .chip.active .diff{background:#fff;color:var(--primary)}
  .chip .diff.hard{background:var(--error-soft);color:var(--error)}
  .chip.active .diff.hard{background:#fff}
  /* module chips */
  .mchip{display:flex;align-items:center;gap:9px;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius-pill);padding:8px 15px 8px 8px;font-size:14px;font-weight:600;color:var(--text-2);transition:all .16s ease}
  .mchip:hover{border-color:var(--border-strong);transform:translateY(-1px)}
  .mchip.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-dark)}
  .mchip.soon{opacity:.6}
  .mchip .ab{font-size:11px;font-weight:800;padding:4px 9px;border-radius:var(--radius-pill);background:var(--surface-2);color:var(--text-2);letter-spacing:.02em}
  .mchip.active .ab{background:var(--accent);color:#fff}
  .mchip .mn{display:flex;flex-direction:column;line-height:1.15;align-items:flex-start}
  .mchip .mn small{font-size:10.5px;color:var(--muted);font-weight:500}
  .mchip .st{font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:var(--radius-pill);background:var(--surface-2);color:var(--muted);margin-left:2px}

  /* ===== Scenario cards ===== */
  .scenarios{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
  .scn{position:relative;text-align:left;padding:16px;border-radius:var(--radius);border:1.5px solid var(--border);background:var(--surface);transition:all .16s ease;overflow:hidden}
  .scn:hover{border-color:var(--border-strong);transform:translateY(-2px);box-shadow:var(--shadow-lg)}
  .scn.active{border-color:var(--primary);background:var(--primary-soft)}
  .scn .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:19px;background:var(--surface-2);margin-bottom:10px}
  .scn.active .ic{background:#fff}
  .scn h3{font-size:14.5px;font-weight:700;margin-bottom:3px}
  .scn p{font-size:12px;color:var(--text-2);line-height:1.45}
  .scn .tag{position:absolute;top:12px;right:12px;font-size:10px;font-weight:700;padding:3px 8px;border-radius:var(--radius-pill)}
  .scn .tag.ready{background:var(--success-soft);color:var(--success)}
  .scn .tag.soon{background:var(--surface-2);color:var(--muted)}

  /* ===== Start bar ===== */
  .startbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:22px;padding:16px 18px;border-radius:var(--radius);background:linear-gradient(120deg,#1e293b,#334155);color:#fff;box-shadow:var(--shadow-lg)}
  .startbar .sel{font-size:13px;opacity:.9}
  .startbar .sel b{opacity:1}
  .btn-start{background:#fff;color:#1e293b;font-weight:700;font-size:14.5px;padding:11px 22px;border-radius:var(--radius-pill);display:flex;align-items:center;gap:8px;transition:all .16s ease}
  .btn-start:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(0,0,0,.25)}

  /* ===== SESSION VIEW ===== */
  #setup.hidden,#session.hidden{display:none}
  #session{animation:fadeUp .4s ease both}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  .sess-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:12px}
  .sess-meta{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:var(--radius-pill);background:var(--surface);border:1px solid var(--border)}
  .btn-exit{font-size:13px;color:var(--text-2);font-weight:600;padding:7px 13px;border-radius:var(--radius-pill);border:1px solid var(--border);background:var(--surface)}
  .btn-exit:hover{color:var(--error);border-color:var(--error)}

  /* progress steps */
  .steps{display:flex;align-items:center;gap:6px;margin-bottom:16px}
  .step{flex:1;height:5px;border-radius:4px;background:var(--border);overflow:hidden;position:relative}
  .step.done{background:var(--success)}
  .step.now{background:var(--primary)}

  /* chat / turn area */
  .turn{padding:20px}
  .stage-label{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:5px 11px;border-radius:var(--radius-pill);margin-bottom:14px}
  .stage-listen{background:var(--primary-soft);color:var(--primary-dark)}
  .stage-help{background:var(--accent-soft);color:var(--accent-dark)}
  .stage-speak{background:var(--warn-soft);color:var(--warn)}
  .stage-feedback{background:var(--success-soft);color:var(--success)}

  .speaker{display:flex;align-items:center;gap:11px;margin-bottom:14px}
  .avatar{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:22px;background:var(--surface-2);flex-shrink:0}
  .speaker .nm{font-size:14.5px;font-weight:700}
  .speaker .rl{font-size:12px;color:var(--text-2)}

  /* audio player */
  .player{display:flex;align-items:center;gap:14px;background:var(--surface-2);border-radius:var(--radius);padding:15px 17px;margin-bottom:8px}
  .play-btn{width:52px;height:52px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:20px;flex-shrink:0;transition:all .16s ease;box-shadow:0 3px 10px rgba(37,99,235,.35)}
  .play-btn:hover{transform:scale(1.05)}
  .play-btn.playing{background:var(--error);box-shadow:0 3px 10px rgba(217,48,37,.35)}
  .play-btn.sm{width:40px;height:40px;font-size:16px}
  .wave{flex:1;display:flex;align-items:center;gap:3px;height:38px}
  .wave span{flex:1;background:var(--border-strong);border-radius:3px;height:30%;transition:height .2s ease}
  .wave.active span{background:var(--primary);animation:bounce 1s ease-in-out infinite}
  @keyframes bounce{0%,100%{height:20%}50%{height:90%}}
  .speed-ctrl{display:flex;gap:5px}
  .speed-btn{font-size:12px;font-weight:700;padding:6px 10px;border-radius:8px;background:var(--surface);border:1px solid var(--border);color:var(--text-2)}
  .speed-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}

  .hint-row{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}
  .hint-btn{font-size:13px;font-weight:600;padding:9px 15px;border-radius:var(--radius-pill);border:1.5px solid var(--border);background:var(--surface);color:var(--text-2);display:flex;align-items:center;gap:7px;transition:all .15s ease}
  .hint-btn:hover{border-color:var(--accent);color:var(--accent-dark);background:var(--accent-soft)}
  .hint-btn .em{font-size:15px}

  .btn-primary{background:var(--primary);color:#fff;font-weight:700;font-size:14.5px;padding:12px 24px;border-radius:var(--radius-pill);display:inline-flex;align-items:center;gap:8px;transition:all .16s ease;box-shadow:0 3px 10px rgba(37,99,235,.28)}
  .btn-primary:hover{background:var(--primary-dark);transform:translateY(-1px)}
  .btn-accent{background:var(--accent);color:#fff;font-weight:700;font-size:14.5px;padding:12px 24px;border-radius:var(--radius-pill);display:inline-flex;align-items:center;gap:8px;transition:all .16s ease;box-shadow:0 3px 10px rgba(124,58,237,.28)}
  .btn-accent:hover{background:var(--accent-dark);transform:translateY(-1px)}
  .btn-ghost{background:var(--surface);color:var(--text-2);font-weight:600;font-size:14px;padding:12px 20px;border-radius:var(--radius-pill);border:1.5px solid var(--border)}
  .btn-ghost:hover{border-color:var(--border-strong)}
  .actions{display:flex;gap:11px;flex-wrap:wrap;margin-top:20px;align-items:center}

  /* self-assessment */
  .selfcheck{background:var(--surface-2);border-radius:var(--radius);padding:16px 18px;margin-top:16px}
  .selfcheck h4{font-size:14px;font-weight:700;margin-bottom:12px}
  .scale{display:flex;gap:8px}
  .scale-btn{flex:1;text-align:center;padding:12px 8px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:var(--surface);font-size:13px;font-weight:600;color:var(--text-2);transition:all .15s ease}
  .scale-btn:hover{border-color:var(--primary)}
  .scale-btn.sel{background:var(--primary);color:#fff;border-color:var(--primary)}
  .scale-btn .big{display:block;font-size:20px;margin-bottom:3px}

  /* ===== HELP / DECODE (UPGRADED) ===== */
  .decode{margin-top:16px;border:1.5px solid var(--accent);border-radius:var(--radius);overflow:hidden;animation:fadeUp .3s ease both}
  .decode-head{background:var(--accent-soft);padding:12px 16px;font-size:13.5px;font-weight:700;color:var(--accent-dark);display:flex;align-items:center;gap:8px}
  .decode-body{padding:16px}

  /* sub-step nav within help */
  .substeps{display:flex;gap:6px;padding:12px 16px;background:var(--surface-2);border-bottom:1px solid var(--border);overflow-x:auto}
  .substep{flex-shrink:0;display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;padding:7px 12px;border-radius:var(--radius-pill);color:var(--muted);background:var(--surface);border:1.5px solid var(--border);white-space:nowrap}
  .substep.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  .substep.done{color:var(--accent-dark);border-color:var(--accent)}
  .substep .n{width:18px;height:18px;border-radius:50%;background:var(--surface-2);color:var(--muted);display:grid;place-items:center;font-size:11px}
  .substep.active .n{background:rgba(255,255,255,.25);color:#fff}
  .substep.done .n{background:var(--accent);color:#fff}

  /* gap-fill quiz */
  .quiz-q{font-size:13px;color:var(--text-2);margin-bottom:14px}
  .quiz-sentence{font-size:16px;line-height:2;font-weight:600;margin-bottom:16px}
  .gap{display:inline-flex;align-items:center;justify-content:center;min-width:96px;height:32px;padding:0 10px;margin:0 3px;border-radius:8px;border:2px dashed var(--accent);background:var(--accent-soft);color:var(--accent-dark);font-size:13px;font-weight:700;vertical-align:middle;cursor:pointer}
  .gap.filled{border-style:solid;background:#fff}
  .gap.correct{border-color:var(--success);background:var(--success-soft);color:var(--success)}
  .gap.wrong{border-color:var(--error);background:var(--error-soft);color:var(--error)}
  .opt-pool{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
  .opt{font-size:13px;font-weight:600;padding:8px 14px;border-radius:var(--radius-pill);border:1.5px solid var(--border);background:var(--surface);color:var(--text);transition:all .14s ease}
  .opt:hover{border-color:var(--accent);transform:translateY(-1px)}
  .opt.used{opacity:.35;pointer-events:none}
  .quiz-result{margin-top:14px;padding:13px 15px;border-radius:var(--radius-sm);font-size:13.5px;line-height:1.6}
  .quiz-result.ok{background:var(--success-soft);color:var(--success)}
  .quiz-result.diag{background:var(--warn-soft);color:var(--warn)}

  /* sound-linking / liaison training */
  .sound-card{border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 15px;margin-bottom:12px;background:var(--surface)}
  .sound-card:last-child{margin-bottom:0}
  .sound-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:9px}
  .sound-written{font-size:15px;font-weight:700}
  .sound-arrow{color:var(--muted);font-size:15px}
  .sound-heard{font-size:15px;font-weight:700;font-family:var(--mono);color:var(--accent-dark);background:var(--accent-soft);padding:2px 9px;border-radius:6px}
  .sound-play{margin-left:auto;display:flex;gap:6px}
  .mini-play{width:34px;height:34px;border-radius:8px;background:var(--surface-2);border:1px solid var(--border);display:grid;place-items:center;font-size:14px;color:var(--text-2)}
  .mini-play:hover{background:var(--primary);color:#fff;border-color:var(--primary)}
  .mini-play.slow{font-size:12px;font-weight:700}
  .sound-tip{font-size:12.5px;color:var(--text-2);line-height:1.5}
  .sound-tip b{color:var(--text)}
  .sound-type{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:var(--radius-pill);background:var(--accent-soft);color:var(--accent-dark);margin-bottom:8px}

  /* accent library */
  .acc-lib{background:var(--surface-2);border-radius:var(--radius-sm);padding:15px 16px}
  .acc-feature{font-size:13.5px;line-height:1.7;margin-bottom:8px;display:flex;gap:9px}
  .acc-feature .em{flex-shrink:0}
  .acc-feature b{color:var(--text)}
  .phrase-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
  .phrase{background:#fff;border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 11px}
  .phrase .p-en{font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:6px}
  .phrase .p-play{width:24px;height:24px;border-radius:6px;background:var(--surface-2);display:grid;place-items:center;font-size:11px;color:var(--text-2);flex-shrink:0}
  .phrase .p-play:hover{background:var(--primary);color:#fff}
  .phrase .p-zh{font-size:12px;color:var(--text-2);margin-top:3px}

  /* shadowing */
  .shadow-line{border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 15px;margin-bottom:11px;background:var(--surface)}
  .shadow-line:last-child{margin:0}
  .shadow-en{font-size:14.5px;font-weight:600;line-height:1.5;margin-bottom:10px}
  .shadow-ctrls{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .shadow-rec{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700;padding:8px 15px;border-radius:var(--radius-pill);background:var(--warn);color:#fff;transition:all .15s ease}
  .shadow-rec:hover{background:#d4770a}
  .shadow-rec.recording{background:var(--error);animation:pulse 1.3s ease-in-out infinite}
  .shadow-score{font-size:12.5px;font-weight:700;padding:5px 11px;border-radius:var(--radius-pill)}
  .shadow-score.hidden{display:none}
  .shadow-score.good{background:var(--success-soft);color:var(--success)}
  .shadow-score.mid{background:var(--warn-soft);color:var(--warn)}
  .shadow-heard{font-size:12px;color:var(--text-2);margin-top:8px;font-style:italic}

  .decode-tip{background:var(--surface-2);border-radius:var(--radius-sm);padding:11px 13px;margin-top:12px;font-size:13px;color:var(--text-2);display:flex;gap:9px}
  .decode-tip b{color:var(--text)}
  .decode-tip .em{font-size:16px;flex-shrink:0}
  /* per-sentence practice (完全听不懂 path) */
  .sent-card{border:1px solid var(--border);border-radius:var(--radius-sm);padding:13px 15px;margin-bottom:11px;background:var(--surface)}
  .sent-card:last-child{margin:0}
  .sent-idx{font-size:10px;font-weight:700;padding:2px 8px;border-radius:var(--radius-pill);background:var(--primary-soft);color:var(--primary-dark);margin-bottom:7px;display:inline-block}
  .sent-en{font-size:14.5px;font-weight:600;line-height:1.5;margin-bottom:5px}
  .sent-zh{font-size:12.5px;color:var(--text-2);margin-bottom:10px;display:none}
  .sent-zh.show{display:block}
  .sent-ctrls{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .sent-btn{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:7px 12px;border-radius:var(--radius-pill);border:1.5px solid var(--border);background:var(--surface);color:var(--text-2);transition:all .14s ease}
  .sent-btn:hover{border-color:var(--accent);color:var(--accent-dark);background:var(--accent-soft)}
  .sent-btn.rec{background:var(--warn);color:#fff;border-color:var(--warn)}
  .sent-btn.rec.recording{background:var(--error);border-color:var(--error);animation:pulse 1.3s ease-in-out infinite}
  .sent-heard{font-size:12px;color:var(--text-2);margin-top:8px;font-style:italic}
  /* per-sentence decode (听感拆解 inside each sentence card) */
  .sent-decode{margin-top:10px;border-top:1px dashed var(--border);padding-top:10px;display:none}
  .sent-decode.show{display:block}
  .spt{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:8px 0;border-bottom:1px dotted var(--border)}
  .spt:last-child{border:none}
  .spt .w{font-size:13px;font-weight:700}
  .spt .arr{color:var(--muted);font-size:12px}
  .spt .hd{font-size:12.5px;font-weight:700;font-family:var(--mono);color:var(--accent-dark);background:var(--accent-soft);padding:1px 8px;border-radius:5px}
  .spt .ty{font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:var(--radius-pill);background:var(--surface-2);color:var(--text-2)}
  .spt .pl{width:26px;height:26px;border-radius:6px;background:var(--surface-2);display:grid;place-items:center;font-size:11px;color:var(--text-2);margin-left:auto}
  .spt .pl:hover{background:var(--primary);color:#fff}
  .spt-tip{font-size:12px;color:var(--text-2);line-height:1.5;width:100%;padding-left:2px}
  .reveal-full{background:#fff;border:1.5px solid var(--success);border-radius:var(--radius-sm);padding:14px 16px;margin-top:6px}
  .reveal-full .lbl{font-size:11px;font-weight:700;color:var(--success);text-transform:uppercase;letter-spacing:.05em;margin-bottom:7px}
  .reveal-full .full-en{font-size:15px;font-weight:600;line-height:1.6;margin-bottom:8px}
  .reveal-full .full-zh{font-size:13px;color:var(--text-2)}

  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(217,48,37,.4)}50%{box-shadow:0 0 0 8px rgba(217,48,37,0)}}

  /* speak / record */
  .rec-zone{text-align:center;padding:10px 0}

  .suggest .em{font-size:15px;flex-shrink:0}
  .my-answer{background:var(--surface-2);border-radius:var(--radius);padding:14px 16px;margin-top:14px;text-align:left}
  .my-answer .lbl{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
  .my-answer .txt{font-size:14.5px;line-height:1.5}
  .type-fallback{width:100%;margin-top:12px;border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:11px 13px;font-size:14px;font-family:inherit;resize:vertical;min-height:60px}

  /* feedback */
  .fb-scores{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
  .fb-score{background:var(--surface-2);border-radius:var(--radius);padding:14px 10px;text-align:center}
  .fb-score .ring{width:56px;height:56px;margin:0 auto 8px;position:relative}

  .fb-block.gram{background:var(--warn-soft)}
  .fb-block.express{background:var(--primary-soft)}
  .fb-block.good{background:var(--success-soft)}

  .fb-item .word{font-family:var(--mono);font-weight:700;background:#fff;padding:1px 6px;border-radius:5px;border:1px solid var(--border)}

  .footer-note{text-align:center;font-size:12px;color:var(--muted);margin-top:26px;line-height:1.6}
  /* ===== Progress / stats ===== */
  .stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 10px;text-align:center;box-shadow:var(--shadow)}
  .stat .v{font-size:22px;font-weight:800;color:var(--primary);font-family:var(--mono)}
  .stat .k{font-size:11.5px;color:var(--text-2);margin-top:3px}
  .stat.streak .v{color:var(--warn)}
  .cal-week{display:flex;gap:6px;justify-content:center;margin-top:12px}
  .cal-day{flex:1;max-width:44px;text-align:center;font-size:10px;color:var(--muted)}

  .cal-dot.done{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
  .cal-dot.today{box-shadow:0 0 0 2px var(--primary)}
  .weak-words{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
  .weak-word{font-size:12px;font-weight:600;background:var(--error-soft);color:var(--error);padding:4px 10px;border-radius:var(--radius-pill)}
  .stats-empty{font-size:13px;color:var(--muted);text-align:center;padding:16px}
  @media (max-width:560px){ .stats-grid{grid-template-columns:1fr 1fr} }
  .view-records{display:block;width:100%;margin-top:12px;font-size:13.5px;font-weight:700;color:var(--primary-dark);background:var(--primary-soft);border:1px solid var(--primary);border-radius:var(--radius-pill);padding:10px}

  /* records overlay */
  .rec-overlay{position:fixed;inset:0;background:rgba(20,30,50,.5);display:none;align-items:flex-start;justify-content:center;z-index:999;padding:40px 14px}
  .rec-modal{background:var(--surface);border-radius:var(--radius);width:100%;max-width:600px;max-height:82vh;display:flex;flex-direction:column;box-shadow:var(--shadow-lg);overflow:hidden}

  .rec-tab{font-size:13.5px;font-weight:700;padding:8px 14px;border-radius:var(--radius-pill);border:1.5px solid var(--border);background:var(--surface);color:var(--text-2)}

  .rec-close{font-size:18px;color:var(--text-2);width:32px;height:32px;border-radius:8px}
  .rec-close:hover{background:var(--surface-2)}
  .rec-body{padding:14px;overflow-y:auto}
  .rec-item{border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:10px;background:var(--surface)}
  .rec-item-head{display:flex;align-items:center;justify-content:space-between;cursor:pointer}
  .rec-combo{font-size:13.5px;font-weight:700}
  .rec-time{font-size:12px;color:var(--muted)}
  .rec-item-detail{margin-top:10px;border-top:1px dashed var(--border);padding-top:10px}
  .rec-line{font-size:13px;line-height:1.5;margin-bottom:6px}
  .fav-text{font-size:14px;font-weight:600;line-height:1.5;color:var(--text)}
  .fav-ctx{font-size:11.5px;color:var(--muted);margin-top:5px}
  .fav-del{font-size:12px;color:var(--error);margin-top:8px}
  .fav-btn{background:none;font-size:18px;line-height:1;padding:2px 6px;border-radius:6px}
  .fav-btn:hover{background:var(--surface-2)}
  /* ===== Mobile adaptation (≤560px) ===== */
  @media (max-width: 560px){
    .app{padding:14px 12px calc(48px + env(safe-area-inset-bottom))}
    .top{margin-bottom:14px}
    .brand h1{font-size:16px}
    .brand p{font-size:11px}
    .streak{padding:5px 10px;font-size:12px}
    .section-label{font-size:11px;margin:18px 2px 9px}
    /* selectors: horizontal scroll rows on phone */
    .chips{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px;gap:8px}
    .chip{flex:0 0 auto;padding:9px 13px;font-size:13.5px}
    .mchip{flex:0 0 auto}
    .scenarios{grid-template-columns:1fr 1fr;gap:9px}
    .scn{padding:13px}
    .scn h3{font-size:13.5px}
    .scn p{font-size:11.5px}
    /* start bar stacks */
    .startbar{flex-direction:column;align-items:stretch;gap:11px;padding:14px}
    .startbar .sel{font-size:12.5px;text-align:center}
    .btn-start{justify-content:center;width:100%;padding:13px}
    /* session */
    .turn{padding:15px}
    .sess-meta{gap:6px}
    .pill{font-size:11.5px;padding:5px 10px}
    .avatar{width:40px;height:40px;font-size:19px}
    /* audio player + waveform */
    .player{gap:10px;padding:12px 13px}
    .play-btn{width:46px;height:46px;font-size:18px}
    .wave{height:32px}
    .speed-ctrl{flex-direction:column;gap:4px}
    /* self-check scale: keep 3 across but tighter */
    .scale{gap:6px}
    .scale-btn{padding:10px 4px;font-size:12px}
    .scale-btn .big{font-size:18px}
    /* feedback: 4 scores -> 2x2 grid on phone */
    .fb-scores{grid-template-columns:1fr 1fr;gap:9px}
    /* actions stack full-width, easy to tap */
    .actions{flex-direction:column;align-items:stretch;gap:9px}
    .actions button{width:100%;justify-content:center}
    .btn-primary,.btn-accent,.btn-ghost{padding:13px 18px}
    /* help sub-steps scroll */
    .substeps{gap:5px}
    .substep{padding:7px 10px;font-size:11.5px}
    /* per-sentence + shadow controls wrap comfortably */
    .sent-ctrls, .shadow-ctrls{gap:6px}
    .sent-btn{font-size:11.5px;padding:7px 10px}
    /* mic + recording zone */
    .mic-btn{width:70px;height:70px;font-size:27px}
    .type-fallback{font-size:15px}   /* ≥16px avoids iOS zoom; 15 acceptable */
  }
  /* larger phones / small tablets */
  @media (min-width: 561px) and (max-width: 780px){
    .scenarios{grid-template-columns:1fr 1fr;}
  }
</style>
</head>

// Build the current turn adapted to the selected accent.
// A turn may carry byAccent:{us:{sounds,globalTip,pts:{0:[...],1:[...]}}, gb:{...}, au:{...}}.
// Missing accent overrides fall back to the base (India) content.
function curTurn(){
  const base = curScript()[S.turn];
  const ov = base.byAccent && base.byAccent[S.accent];
  if(!ov) return base;
  const merged = Object.assign({}, base);
  if(ov.sounds) merged.sounds = ov.sounds;
  if(ov.globalTip) merged.globalTip = ov.globalTip;
  if(ov.pts && base.sentences){
    merged.sentences = base.sentences.map(function(st,i){
      return ov.pts[i] ? Object.assign({}, st, {points: ov.pts[i]}) : st;
    });
  }
  return merged;

// ============ PROGRESS (打卡 + 学习记录，存 localStorage) ============
const PROG_KEY='bizenglish_progress_v1';
function loadProg(){
  try{ return JSON.parse(localStorage.getItem(PROG_KEY)) || null; }catch(e){ return null; }
  }
function defaultProg(){ return { totalTurns:0, totalSessions:0, days:[], lastDay:'', streak:0, weakWords:{}, combos:{}, history:[], favorites:[] }; }
function saveProg(p){ try{ localStorage.setItem(PROG_KEY, JSON.stringify(p)); }catch(e){} }
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function daysBetween(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }

// 完成一个回合就算打卡
function checkIn(comboLabel, detail){
  let p=loadProg()||defaultProg();
  p.totalTurns=(p.totalTurns||0)+1;
  const t=todayStr();
  if(p.lastDay!==t){
    // new day check-in → update streak
    if(p.lastDay && daysBetween(p.lastDay,t)===1) p.streak=(p.streak||0)+1;
    else p.streak=1;
    p.lastDay=t;
    if(!p.days) p.days=[];
    if(p.days.indexOf(t)<0) p.days.push(t);
    p.days=p.days.slice(-60); // keep last 60 days
  }
  if(comboLabel){ p.combos=p.combos||{}; p.combos[comboLabel]=(p.combos[comboLabel]||0)+1; }
  // 记录练习历史（保留最近 50 条）
  p.history=p.history||[];
  p.history.unshift({
    ts: Date.now(), combo: comboLabel||'',
    clientLine: (detail&&detail.clientLine)||'', myAnswer: (detail&&detail.myAnswer)||''
  });
  p.history=p.history.slice(0,50);
  saveProg(p); updateStreakUI();
  return p;
}
function recordWeakWords(words){
  if(!words||!words.length) return;
  let p=loadProg()||defaultProg(); p.weakWords=p.weakWords||{};
  words.forEach(w=>{ w=(w||'').trim().toLowerCase(); if(w) p.weakWords[w]=(p.weakWords[w]||0)+1; });
  saveProg(p);
}
function updateStreakUI(){
  const p=loadProg()||defaultProg();
  const el=document.getElementById('streakDays'); if(el) el.textContent=p.streak||0;
}
function renderStats(){
  const panel=document.getElementById('statsPanel'); if(!panel) return;
  const p=loadProg();
  if(!p || !p.totalTurns){
    panel.innerHTML='<div class="stats-empty">还没有练习记录。完成一个回合即可打卡，开始你的第一天吧！💪</div>'+recViewBtn();
    bindRecView(); return;
  }
  // top weak words
  const ww=Object.keys(p.weakWords||{}).sort((a,b)=>p.weakWords[b]-p.weakWords[a]).slice(0,8);
  // last 7 days calendar
  const names=['日','一','二','三','四','五','六'];
  let cal='';
  for(let i=6;i>=0;i--){
    const d=new Date(); d.setDate(d.getDate()-i);
    const ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    const done=(p.days||[]).indexOf(ds)>=0;
    const isToday=i===0;
    cal+='<div class="cal-day">'+names[d.getDay()]+'<div class="cal-dot '+(done?'done':'')+' '+(isToday?'today':'')+'">'+(done?'🔥':'')+'</div></div>';
  }
  panel.innerHTML=
    '<div class="stats-grid">'+
      '<div class="stat streak"><div class="v">'+(p.streak||0)+'</div><div class="k">连续打卡(天)</div></div>'+
      '<div class="stat"><div class="v">'+(p.totalTurns||0)+'</div><div class="k">累计回合</div></div>'+
      '<div class="stat"><div class="v">'+((p.days||[]).length)+'</div><div class="k">练习天数</div></div>'+
      '<div class="stat"><div class="v">'+ww.length+'</div><div class="k">薄弱词</div></div>'+
    '</div>'+
    '<div class="cal-week">'+cal+'</div>'+
    (ww.length? '<div style="font-size:11.5px;color:var(--muted);margin:12px 0 0 2px">🎯 高频薄弱词（跟读匹配度偏低）：</div><div class="weak-words">'+ww.map(w=>'<span class="weak-word">'+w+'</span>').join('')+'</div>' : '')+recViewBtn();
  bindRecView();
}

function isFav(sentence){ const p=loadProg(); return !!(p && (p.favorites||[]).some(function(f){return f.text===sentence;})); }
function toggleFav(sentence, ctx){
  let p=loadProg()||defaultProg(); p.favorites=p.favorites||[];
  const idx=p.favorites.findIndex(function(f){return f.text===sentence;});
  if(idx>=0){ p.favorites.splice(idx,1); } else { p.favorites.unshift({text:sentence, ctx:ctx||'', ts:Date.now()}); }
  p.favorites=p.favorites.slice(0,100); saveProg(p);
  return isFav(sentence);
}

// 用 AI 动态生成一段全新对话（无限续练的核心）
function genTurns(n){
  const a=ACCENTS.find(x=>x.id===S.accent), sc=SCENARIOS.find(x=>x.id===S.scn), m=MODULES.find(x=>x.id===S.module);
  return fetch(BACKEND_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
    action:'generate', scenario:sc.name, module:m.ab, moduleName:m.name, accent:a.name, turns:n
  })}).then(function(r){return r.json();});
}
// 方案A：先出第1回合立刻开练，后台再补 2 回合
function generateDialogue(){
  const area=document.getElementById('turnArea');
  const a=ACCENTS.find(x=>x.id===S.accent), s=SCENARIOS.find(x=>x.id===S.scn), m=MODULES.find(x=>x.id===S.module);
  S.aiScript=null; S.aiPending=true;
  if(area) area.innerHTML='<div style="text-align:center;padding:40px 16px;color:var(--text-2)">'+
    '<div style="font-size:34px;margin-bottom:10px">✨</div>'+
    '<div style="font-weight:700;font-size:15px;margin-bottom:6px">AI 正在生成第 1 回合…（几秒即可开练）</div>'+
    '<div style="font-size:13px">'+a.name+' × '+m.ab+' × '+s.name+'</div></div>';
  // ① 先只要 1 回合
  genTurns(1).then(function(res){
    if(res && res.turns && res.turns.length){
      S.aiScript=res.turns.slice(0,1); S.turn=0; renderTurn();
      // ② 后台补 2 回合（各自独立生成）
      genTurns(2).then(function(res2){
        if(res2 && res2.turns && res2.turns.length){ S.aiScript=S.aiScript.concat(res2.turns.slice(0,2)); }
        S.aiPending=false;
        // 若用户正卡在"等待下一回合"界面，自动推进
        if(S._waitingNext){ S._waitingNext=false; S.turn++; S.stage='listen'; S.helpSub=0; S.selfLevel=null; S.path=null; S.myAnswer=''; S.quizFills=[]; S.quizChecked=false; renderTurn(); }
      }).catch(function(){ S.aiPending=false; });
    } else {
      if(area) area.innerHTML='<div style="text-align:center;padding:30px 16px;color:var(--error)">生成失败：'+(res && res.error?res.error:'返回格式异常')+'<br><span style="color:var(--text-2);font-size:12px">将使用内置样例对话。</span></div>';
      setTimeout(function(){ S.aiScript=null; S.aiPending=false; renderTurn(); },1500);
    }
  }).catch(function(err){
    if(area) area.innerHTML='<div style="text-align:center;padding:30px 16px;color:var(--error)">连接后端失败：'+err.message+'<br><span style="color:var(--text-2);font-size:12px">将使用内置样例对话。</span></div>';
    setTimeout(function(){ S.aiScript=null; S.aiPending=false; renderTurn(); },1500);
  });
}

                : '🎯 聚焦关键难点 · 定位卡点 → 听感拆解 → 跟读';
  return `
  <div class="stage-label stage-help">🧩 第二步 · 帮你听懂</div>

}
function renderHelpSub(d){
  if(S.path==='low'){
    if(S.helpSub===0) return subSentences(d);

    return subReveal(d);
  }
  if(S.path==='high'){
    return subReveal(d);
  }

  if(S.helpSub===0) return subLocate(d);

// SUB 1: locate where you got stuck (gap-fill)
function subLocate(d, asCheck){
  const q=d.quiz;
  // build sentence with gaps
  let html = q.template;
  q.blanks.forEach((b,i)=>{
    const filled = S.quizFills[i];
    const cls = S.quizChecked ? (filled===b?'correct':'wrong') : (filled?'filled':'');
    html = html.replace('{'+i+'}', `<span class="gap ${cls}" data-gap="${i}">${filled||'____'}</span>`);
  });
  // shuffle pool once per turn
  if(!S._pool || S._poolTurn!==S.turn){ S._pool=[...q.pool].sort(()=>Math.random()-.5); S._poolTurn=S.turn; }
  const used = S.quizFills.filter(Boolean);
  const pool = S._pool.map(o=>`<button class="opt ${used.includes(o)?'used':''}" data-opt="${o}">${o}</button>`).join('');
  return `
    <div class="player" style="margin-bottom:14px">
      <button class="play-btn sm" id="playBtn">▶</button>
      <div class="wave" id="wave">${'<span></span>'.repeat(24)}</div>
      <div class="speed-ctrl">
        <button class="speed-btn" data-sp="0.7">0.7×</button>
        <button class="speed-btn active" data-sp="1">1×</button></div>
    </div>
    <div class="quiz-q">${asCheck ? '✅ <b>检验一下：</b>刚才逐句练完了，现在不看原文，把听到的关键词填进空格，看看是不是真的能听出来了：' : q.q}</div>
    <div class="quiz-sentence">${html}</div>
    <div class="opt-pool">${pool}</div>
    <div class="actions" style="margin-top:12px">
      <button class="btn-ghost" id="quizReset" style="padding:9px 16px">重填</button>
      <button class="btn-accent" id="quizCheck" style="padding:9px 18px">对答案</button>
    </div>
    ${S.quizChecked?`<div class="quiz-result diag"><b>🔎 诊断：</b>${q.diagnose}</div>`:''}
  `;
}

      stroke-dasharray="${c}" stroke-dashoffset="${off}" stroke-linecap="round"
      transform="rotate(-90 28 28)"/></svg>`;
}

// Call the backend (which calls Qwen) and render REAL feedback based on the user's actual answer.
function runAIFeedback(d){
  var body=document.getElementById('fbBody');
  var cacheKey=S.turn+'|'+S.myAnswer;
  if(fbCache[cacheKey]){ renderRealFeedback(fbCache[cacheKey], d); return; }
  var payload={
    action: 'feedback',
    userAnswer: S.myAnswer||'',
    clientLine: d.en||'',
    scenario: (SCENARIOS.find(function(x){return x.id===S.scn;})||{}).name||'',
    module: (MODULES.find(function(x){return x.id===S.module;})||{}).ab||'',
    accent: (ACCENTS.find(function(x){return x.id===S.accent;})||{}).name||''
  };
  fetch(BACKEND_URL, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload) })
    .then(function(r){ return r.json(); })
    .then(function(res){
      if(res && res.error && !res.scores){
        if(body) body.innerHTML='<div style="padding:22px;color:var(--error)">AI 反馈出错：'+(res.error||'')+'<br><span style="color:var(--text-2);font-size:12px">可在下方重试，或检查后端配置。</span></div>';
        return;
      }
      fbCache[cacheKey]=res; renderRealFeedback(res, d);
    })
    .catch(function(err){
      if(body) body.innerHTML='<div style="padding:22px;color:var(--error)">连接后端失败：'+err.message+'<br><span style="color:var(--text-2);font-size:12px">请检查 BACKEND_URL 是否填对、Worker 是否已部署。</span></div>';
    });
}

function renderRealFeedback(res, d){
  var body=document.getElementById('fbBody'); if(!body) return;
  var sc=res.scores||{};
  function list(items){ return (items&&items.length? items : ['—']).map(function(t){ return '<div class="fb-item">• '+t+'</div>'; }).join(''); }
  var g=sc.grammar!=null?sc.grammar:'-', e=sc.expression!=null?sc.expression:'-', f=sc.fluency!=null?sc.fluency:'-';
  body.innerHTML =
    '<div class="fb-scores">'+
      '<div class="fb-score"><div class="ring">'+ring(typeof g==='number'?g:0,'var(--warn)')+'<div class="num">'+g+'</div></div><div class="lbl">语法/用词</div></div>'+
      '<div class="fb-score"><div class="ring">'+ring(typeof e==='number'?e:0,'var(--primary)')+'<div class="num">'+e+'</div></div><div class="lbl">地道表达</div></div>'+
      '<div class="fb-score"><div class="ring">'+ring(typeof f==='number'?f:0,'var(--success)')+'<div class="num">'+f+'</div></div><div class="lbl">流利度</div></div>'+
    '</div>'+
    '<div class="my-answer" style="margin-bottom:14px"><div class="lbl">你的回答</div><div class="txt">'+(S.myAnswer||'')+'</div></div>'+
    '<div class="fb-block gram"><h4>🟠 语法 / 用词修正</h4>'+list(res.grammar)+'</div>'+
    '<div class="fb-block express"><h4>🔵 更地道的商务表达建议</h4>'+list(res.expression)+'</div>'+
    (res.modelAnswer? '<div class="fb-block express"><h4>💡 参考范例回答 <button class="fav-btn" id="favModelBtn" title="收藏这句地道表达">'+(isFav(res.modelAnswer)?'⭐':'☆')+'</button></h4><div class="fb-item"><span style="display:block;background:#fff;border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.55">"'+res.modelAnswer+'"</span></div></div>':'')+
    '<div class="fb-block good"><h4>🟢 做得好</h4>'+list(res.good)+'</div>'+
    '<div style="font-size:11.5px;color:var(--muted);text-align:center;margin-top:8px">🤖 由通义千问基于你的实际回答生成 · 发音评分需专业引擎，暂未包含</div>';
  // 收藏范例句按钮
  const fb=document.getElementById('favModelBtn');
  if(fb && res.modelAnswer){ fb.onclick=function(){ const a=ACCENTS.find(x=>x.id===S.accent),m=MODULES.find(x=>x.id===S.module),sc=SCENARIOS.find(x=>x.id===S.scn);
    const on=toggleFav(res.modelAnswer, (a?a.name:'')+' · '+(m?m.ab:'')+' · '+(sc?sc.name:'')); fb.textContent=on?'⭐':'☆'; }; }
}

// ============ AUDIO ============
function speak(text, rate){
  if(!synth) return;
  synth.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.rate = rate || S.speed || 1;
  const hints=(ACCENTS.find(a=>a.id===S.accent)||{}).voiceHint||['en-US'];
  let v=null;
  for(const h of hints){ v=voices.find(x=>x.lang&&x.lang.toLowerCase().startsWith(h.toLowerCase())); if(v)break; }
  if(!v) v=voices.find(x=>x.lang&&x.lang.toLowerCase().startsWith('en'));
  if(v) u.voice=v;
  const wave=document.getElementById('wave'), btn=document.getElementById('playBtn');
  u.onstart=()=>{ if(wave)wave.classList.add('active'); if(btn){btn.classList.add('playing');btn.textContent='⏸';} };
  u.onend=()=>{ if(wave)wave.classList.remove('active'); if(btn){btn.classList.remove('playing');btn.textContent='▶';} };
  synth.speak(u);
}
function togglePlay(text){
  const btn=document.getElementById('playBtn');
  if(synth && synth.speaking){ synth.cancel(); if(btn){btn.classList.remove('playing');btn.textContent='▶';} const w=document.getElementById('wave'); if(w)w.classList.remove('active'); }
  else speak(text);
}

// ============ SPEECH RECOGNITION ============
function initRecog(lang){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR) return null;
  const r=new SR(); r.lang=lang||'en-US'; r.interimResults=true; r.continuous=true; r.maxAlternatives=1;
  return r;
}
let recog=null, recActive=false;
let mediaRec=null, mediaStream=null, audioChunks=[];

// Recording is the PRIMARY driver. Speech recognition is a best-effort add-on that
// never blocks or interrupts recording (it often fails under file:// — that's fine).
function toggleRec(){
  var btn=document.getElementById('micBtn'), hint=document.getElementById('recHint'), box=document.getElementById('typeBox');
  if(recActive){ stopRec(btn, hint); return; }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    hint.textContent='此环境不支持录音（需 HTTPS 或用 Chrome/Edge 打开）。可直接在下方打字。'; return;
  }
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    mediaStream=stream; audioChunks=[];
    // start recorder
    try{
      mediaRec=new MediaRecorder(stream);
      mediaRec.ondataavailable=function(e){ if(e.data && e.data.size>0) audioChunks.push(e.data); };
      mediaRec.onstop=function(){
        try{
          var blob=new Blob(audioChunks,{type:(audioChunks[0]&&audioChunks[0].type)||'audio/webm'});
          var url=URL.createObjectURL(blob);
          var au=document.getElementById('myAudio'), pbBox=document.getElementById('playbackBox');
          if(au&&pbBox){ au.src=url; pbBox.style.display='inline-flex'; }
        }catch(e){}
        if(mediaStream){ mediaStream.getTracks().forEach(function(t){t.stop();}); mediaStream=null; }
      };
      mediaRec.start();
    }catch(e){ hint.textContent='录音启动失败：'+e.message+'。可直接打字。'; }
    // best-effort recognition (may silently fail on file://)
    startRecognitionSafe(box);
    // UI: recording
    recActive=true; btn.classList.add('recording'); btn.textContent='⏹';
    hint.textContent='🔴 录音中 (v2)…（再次点击停止）· 说完可回放对比';
  }).catch(function(err){
    hint.textContent='没拿到麦克风权限（'+err.name+'）。请在地址栏允许麦克风，或直接打字。';
  });
}

function stopRec(btn, hint){
  recActive=false;   // set FIRST so recognition.onend does not auto-restart
  try{ if(mediaRec && mediaRec.state!=='inactive') mediaRec.stop(); }catch(e){}
  try{ if(recog) recog.stop(); }catch(e){}
  if(btn){ btn.classList.remove('recording'); btn.textContent='🎤'; }
  var shown=(S._finalTxt||'').trim();
  if(hint) hint.textContent = shown ? ('已停止 · 识别到：'+shown) : '已停止 · 点▶回放你的录音 · 识别不到可直接打字修改';
}

function startRecognitionSafe(box){
  try{
    if(!recog) recog=initRecog('en-US');
    if(!recog){ var h=document.getElementById('recHint'); if(h) h.textContent='🔴 录音中…（此浏览器不支持自动识别，可停止后打字）'; return; }
    S._finalTxt='';   // accumulated final transcript for this recording
    recog.onresult=function(e){
      var interim='';
      for(var k=e.resultIndex;k<e.results.length;k++){
        var tt=e.results[k][0].transcript;
        if(e.results[k].isFinal){ S._finalTxt += (S._finalTxt?' ':'') + tt.trim(); }
        else { interim += tt; }
      }
      var shown=(S._finalTxt+' '+interim).trim();
      if(box){ box.value=shown; S.myAnswer=shown; showMyAnswer(); }
      var h=document.getElementById('recHint'); if(h && shown) h.textContent='🔴 识别中：'+shown;
    };
    recog.onerror=function(ev){ /* no-speech/network etc — ignore, keep recording */ };
    // if recognition drops but we're still recording, restart it so long answers aren't cut off
    recog.onend=function(){ if(recActive){ try{ recog.start(); }catch(e){} } };
    recog.start();
  }catch(e){ /* recognition unavailable — recording still primary */ }
}

// playback of the user's own recording
function togglePlayback(){
  const au=document.getElementById('myAudio'), btn=document.getElementById('pbBtn'), tEl=document.getElementById('pbTime');
  if(!au || !au.src) return;
  if(au.paused){
    au.play();
    btn.textContent='⏸ 暂停';
    au.ontimeupdate=()=>{ if(tEl) tEl.textContent=au.currentTime.toFixed(1)+'s'; };
    au.onended=()=>{ btn.textContent='▶ 回放我的录音'; };
  } else { au.pause(); btn.textContent='▶ 回放我的录音'; }
}
function showMyAnswer(){
  const b=document.getElementById('myAnswerBox'), t=document.getElementById('myAnswerTxt');
  if(b&&t){ if(S.myAnswer){ b.style.display='block'; t.textContent=S.myAnswer; } else b.style.display='none'; }
}

// shadowing recognition (per line)
let shRecog=null, shActive=-1;
let shMediaRec=null, shStream=null, shChunks=[];
function toggleShadowRec(idx, target){
  const btn=document.querySelector(`[data-shadow-rec="${idx}"]`);
  const scoreEl=document.getElementById('shScore'+idx), heardEl=document.getElementById('shHeard'+idx);
  if(shActive===idx){ // stop
    try{ if(shMediaRec && shMediaRec.state!=='inactive') shMediaRec.stop(); }catch(e){}
    try{ if(shRecog) shRecog.stop(); }catch(e){}
    return;
  }
  let finalTxt='';
  const finish=()=>{
    btn.classList.remove('recording'); btn.innerHTML='<span>🎤</span> 跟读'; shActive=-1;
    const pct=Math.round(similarity(finalTxt.trim(), target.trim())*100);
    scoreEl.classList.remove('hidden','good','mid');
    scoreEl.classList.add(pct>=80?'good':'mid');
    // 匹配度偏低 → 把这句的词记为薄弱词
    if(pct<80){ try{ recordWeakWords((target||'').replace(/[^A-Za-z0-9'\s]/g,' ').split(/\s+/).filter(w=>w.length>3)); }catch(e){} }
    scoreEl.textContent=(pct>=80?'✓ 匹配 ':'~ 匹配 ')+pct+'%';
  };
  // start audio recording (for replay) + recognition (for score)
  const startRec=(stream)=>{
    shStream=stream; shChunks=[];
    if(stream){ try{
      shMediaRec=new MediaRecorder(stream);
      shMediaRec.ondataavailable=(e)=>{ if(e.data&&e.data.size>0) shChunks.push(e.data); };
      shMediaRec.onstop=()=>{
        try{ var blob=new Blob(shChunks,{type:(shChunks[0]&&shChunks[0].type)||'audio/webm'});
          var au=document.getElementById('shAudio'+idx), rp=document.getElementById('shReplay'+idx);
          if(au){ au.src=URL.createObjectURL(blob); } if(rp){ rp.style.display='inline-grid'; }
        }catch(e){}
        if(shStream){ shStream.getTracks().forEach(t=>t.stop()); shStream=null; }
      };
      shMediaRec.start();
    }catch(e){} }
    // recognition
    if(!shRecog) shRecog=initRecog('en-US');
    if(shRecog){
      shRecog.onresult=(e)=>{ finalTxt=''; for(let i=0;i<e.results.length;i++) finalTxt+=e.results[i][0].transcript; if(heardEl) heardEl.textContent='你说的：'+finalTxt; };
      shRecog.onerror=(e)=>{};
      shRecog.onend=()=>{ finish(); };
      try{ shRecog.start(); }catch(e){}
    } else if(shMediaRec){ shMediaRec.addEventListener('stop', finish, {once:true}); if(heardEl) heardEl.textContent='（此浏览器不支持识别，仅录音可回放）'; }
    shActive=idx; btn.classList.add('recording'); btn.innerHTML='<span>⏹</span> 停止'; if(heardEl) heardEl.textContent='🔴 听你跟读…（再点停止）';
  };
  if(navigator.mediaDevices && navigator.mediaDevices.getUserMedia){
    navigator.mediaDevices.getUserMedia({audio:true}).then(startRec).catch(()=>startRec(null));
  } else { startRec(null); }
}
// replay a shadow recording
function replayShadow(idx){
  const au=document.getElementById('shAudio'+idx);
  if(au && au.src){ au.currentTime=0; au.play(); }
}

function similarity(a,b){
  if(!a) return 0;
  // normalize: lowercase, strip punctuation, collapse spaces, drop contraction apostrophes
  function norm(x){ return (x||'').toLowerCase().replace(/['’]/g,'').replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim(); }
  const wa=norm(a).split(' ').filter(Boolean);
  const wb=norm(b).split(' ').filter(Boolean);
  if(!wb.length) return 0;
  // order-aware match via longest-common-subsequence (rewards correct words in correct order)
  const m=wa.length, n=wb.length;
  const dp=Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let x=1;x<=m;x++){ for(let y=1;y<=n;y++){
    dp[x][y] = wa[x-1]===wb[y-1] ? dp[x-1][y-1]+1 : Math.max(dp[x-1][y], dp[x][y-1]);
  }}
  const lcs=dp[m][n];
  // score = how much of the target you covered, in order
  return Math.min(1, lcs/n);
}

// per-sentence shadow recognition (low path)
let sentRecog=null, sentActive=-1;
function toggleSentRec(idx, target, btn){
  const scoreEl=document.getElementById('sentScore'+idx), heardEl=document.getElementById('sentHeard'+idx);
  if(!sentRecog) sentRecog=initRecog('en-US');
  if(!sentRecog){ if(heardEl)heardEl.textContent='⚠️ 浏览器不支持语音识别'; return; }
  if(sentActive===idx){ sentRecog.stop(); return; }
  let finalTxt='';
  sentRecog.onstart=()=>{ sentActive=idx; btn.classList.add('recording'); btn.textContent='⏹ 停止'; if(heardEl)heardEl.textContent='🔴 听你跟读…'; };
  sentRecog.onresult=(e)=>{ finalTxt=''; for(let i=0;i<e.results.length;i++) finalTxt+=e.results[i][0].transcript; if(heardEl)heardEl.textContent='你说的：'+finalTxt; };
  sentRecog.onerror=(e)=>{ if(heardEl)heardEl.textContent='⚠️ '+e.error; };
  sentRecog.onend=()=>{
    btn.classList.remove('recording'); btn.textContent='🎤 跟读'; sentActive=-1;
    const pct=Math.round(similarity(finalTxt.toLowerCase().trim(), target.toLowerCase().trim())*100);
    if(scoreEl){ scoreEl.classList.remove('hidden','good','mid'); scoreEl.classList.add(pct>=80?'good':'mid'); scoreEl.textContent=(pct>=80?'✓ 匹配 ':'~ 匹配 ')+pct+'%'; }
  };
  try{ sentRecog.start(); }catch(err){}
}

// ============ BIND EVENTS PER TURN ============
function bindTurn(d){
  const $=id=>document.getElementById(id);
  document.querySelectorAll('[data-sp]').forEach(b=>b.onclick=()=>{ S.speed=parseFloat(b.dataset.sp); document.querySelectorAll('[data-sp]').forEach(x=>x.classList.toggle('active',x===b)); });
  if($('playBtn')) $('playBtn').onclick=()=>togglePlay(d.en);
  if($('replayBtn')) $('replayBtn').onclick=()=>speak(d.en, S.speed);
  if($('slowBtn')) $('slowBtn').onclick=()=>speak(d.en, 0.7);
  document.querySelectorAll('[data-lv]').forEach(b=>b.onclick=()=>{
    S.selfLevel=b.dataset.lv; S.path=b.dataset.lv;
    if(S.stage==='listen'){ renderTurn(); }   // re-render so hint + button update
  });

  // stage nav
  if($('toHelp')) $('toHelp').onclick=()=>{
    if(!S.selfLevel){ return; }
    S.stage='help'; S.helpSub = (S.path==='high') ? 3 : 0;   // high jumps straight to reveal
    S.quizFills=[]; S.quizChecked=false; renderTurn();
  };
  if($('backListen')) $('backListen').onclick=()=>{ S.stage='listen'; renderTurn(); };
  if($('toSpeak')) $('toSpeak').onclick=()=>{ S.stage='speak'; renderTurn(); };
  if($('backHelp')) $('backHelp').onclick=()=>{ S.stage='help'; S.helpSub=helpLast(); renderTurn(); };

  // help sub-step nav
  document.querySelectorAll('[data-sub]').forEach(el=>el.onclick=()=>{ S.helpSub=parseInt(el.dataset.sub); renderTurn(); });
  if($('subPrev')) $('subPrev').onclick=()=>{ S.helpSub=Math.max(0,S.helpSub-1); renderTurn(); };
  if($('subNext')) $('subNext').onclick=()=>{ S.helpSub=Math.min(helpLast(),S.helpSub+1); renderTurn(); };

  // === SUB 1 quiz ===
  document.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>{
    const val=b.dataset.opt;
    // fill first empty blank
    const q=d.quiz; let placed=false;
    for(let i=0;i<q.blanks.length;i++){ if(!S.quizFills[i]){ S.quizFills[i]=val; placed=true; break; } }
    if(placed){ S.quizChecked=false; document.getElementById('helpBody').innerHTML=renderHelpSub(d); rebindHelpBody(d); }
  });
  document.querySelectorAll('[data-gap]').forEach(g=>g.onclick=()=>{
    const i=parseInt(g.dataset.gap); S.quizFills[i]=null; S.quizChecked=false;
    document.getElementById('helpBody').innerHTML=renderHelpSub(d); rebindHelpBody(d);
  });
  if($('quizReset')) $('quizReset').onclick=()=>{ S.quizFills=[]; S.quizChecked=false; document.getElementById('helpBody').innerHTML=renderHelpSub(d); rebindHelpBody(d); };
  if($('quizCheck')) $('quizCheck').onclick=()=>{ S.quizChecked=true; document.getElementById('helpBody').innerHTML=renderHelpSub(d); rebindHelpBody(d); };

  // === SUB 2 sounds ===
  document.querySelectorAll('[data-sound]').forEach(b=>b.onclick=()=>{ const i=parseInt(b.dataset.sound); const r=parseFloat(b.dataset.rate); speak(d.sounds[i].written, r); });
  // === SUB 4 shadow ===
  document.querySelectorAll('[data-shadow-play]').forEach(b=>b.onclick=()=>{ const i=parseInt(b.dataset.shadowPlay); const r=b.dataset.rate?parseFloat(b.dataset.rate):1; speak(d.shadow[i], r); });
  document.querySelectorAll('[data-shadow-rec]').forEach(b=>b.onclick=()=>{ const i=parseInt(b.dataset.shadowRec); toggleShadowRec(i, d.shadow[i]); });
  document.querySelectorAll('[data-shadow-replay]').forEach(b=>b.onclick=()=>{ replayShadow(parseInt(b.dataset.shadowReplay)); });

  // === LOW path: per-sentence practice ===
  document.querySelectorAll('[data-sent-play]').forEach(b=>b.onclick=()=>{ const i=parseInt(b.dataset.sentPlay); const r=parseFloat(b.dataset.rate); speak(d.sentences[i].en, r); });
  document.querySelectorAll('[data-sent-decode]').forEach(b=>b.onclick=()=>{
    const i=parseInt(b.dataset.sentDecode); const el=document.getElementById('sentDecode'+i);
    if(el){ el.classList.toggle('show'); b.textContent = el.classList.contains('show')?'🧩 收起拆解':'🧩 听感拆解'; }
  });
  document.querySelectorAll('[data-spt]').forEach(b=>b.onclick=()=>{
    const [si,pi]=b.dataset.spt.split('-').map(Number);
    const pt=(d.sentences[si].points||[])[pi]; if(pt) speak(pt.w, 0.6);
  });
  document.querySelectorAll('[data-sent-zh]').forEach(b=>b.onclick=()=>{
    const i=parseInt(b.dataset.sentZh); const el=document.getElementById('sentZh'+i);
    if(el){ el.classList.toggle('show'); b.textContent = el.classList.contains('show')?'🀄 隐藏中文':'🀄 显示中文'; }
  });
  document.querySelectorAll('[data-sent-rec]').forEach(b=>b.onclick=()=>{ const i=parseInt(b.dataset.sentRec); toggleSentRec(i, d.sentences[i].en, b); });

  // speak stage
  if($('micBtn')) $('micBtn').onclick=toggleRec;
  if($('pbBtn')) $('pbBtn').onclick=togglePlayback;
  if($('typeBox')) $('typeBox').oninput=(e)=>{ S.myAnswer=e.target.value; };
  if($('toFeedback')) $('toFeedback').onclick=()=>{
    const box=$('typeBox'); if(box) S.myAnswer=box.value.trim();
    // allow submit if the user recorded audio OR typed text (recognition may fail under file://)
    const hasAudio = !!(document.getElementById('myAudio') && document.getElementById('myAudio').src);
    if(!S.myAnswer && !hasAudio){ alert('先录一段音、或在文本框里打字回应 🙂'); return; }
    if(!S.myAnswer && hasAudio){ S.myAnswer='（已录音，未自动识别文字——可在反馈页参考范例回应）'; }
    // 完成一个回合的口语回应 = 打卡
    try{ const a=ACCENTS.find(x=>x.id===S.accent),m=MODULES.find(x=>x.id===S.module),sc=SCENARIOS.find(x=>x.id===S.scn);
      const d0=curTurn(); checkIn((a?a.name:'')+' × '+(m?m.ab:'')+' × '+(sc?sc.name:''), {clientLine:(d0&&d0.en)||'', myAnswer:S.myAnswer||''}); }catch(e){}
    S.stage='feedback'; renderTurn();
  };
  // feedback nav
  if($('nextTurn')) $('nextTurn').onclick=()=>{
    // AI 模式下若下一回合还在后台生成，显示等待，生成好后自动推进
    if(aiEnabled() && S.aiScript && (S.turn+1 >= S.aiScript.length) && S.aiPending){
      S._waitingNext=true;
      const area=document.getElementById('turnArea');
      if(area) area.innerHTML='<div style="text-align:center;padding:40px 16px;color:var(--text-2)">'+
        '<div style="font-size:30px;margin-bottom:10px">✨</div>'+
        '<div style="font-weight:700;font-size:15px">下一回合马上就好…</div>'+
        '<div style="font-size:13px;margin-top:6px">客户的下一段发言正在生成</div></div>';
      return;
    }
    S.turn++; S.stage='listen'; S.helpSub=0; S.selfLevel=null; S.path=null; S.myAnswer=''; S.quizFills=[]; S.quizChecked=false; renderTurn();
  };
  if($('retrySpeak')) $('retrySpeak').onclick=()=>{ S.stage='speak'; renderTurn(); };
  if($('finishSess')) $('finishSess').onclick=showComplete;
}
// rebind only the help body (after quiz re-render) — reattach sub-step nav + action buttons too
function rebindHelpBody(d){
  bindTurn(d);
}

function showComplete(){
  if(synth) synth.cancel();
  document.getElementById('turnArea').innerHTML=`
  <div style="text-align:center;padding:24px 12px">
    <div style="font-size:52px;margin-bottom:10px">🎉</div>
    <h2 style="font-size:20px;font-weight:800;margin-bottom:8px">完成！你走完了一段完整对话</h2>
    <p style="color:var(--text-2);font-size:14px;max-width:480px;margin:0 auto 20px;line-height:1.6">
      升级后的「帮你听懂」带你走了：<b>定位卡点</b>（填空找出没听清的词）→ <b>听感拆解</b>（书面 vs 实际听到的音）→
      <b>影子跟读</b> → <b>揭示完整原文</b>（英文+中文对照）。<br>
      正式版会记录你每次卡在哪些词/音，自动生成个性化磨耳朵清单。
    </p>
    <div style="display:flex;gap:11px;justify-content:center;flex-wrap:wrap">
      ${aiEnabled()?`<button class="btn-accent" id="genBtn">✨ 换一段全新对话 →</button>`:''}
      <button class="btn-primary" id="againBtn">再练这段 →</button>
      <button class="btn-ghost" id="homeBtn">返回选择</button>
    </div>
  </div>`;
  if(document.getElementById('genBtn')) document.getElementById('genBtn').onclick=()=>{ Object.assign(S,{turn:0,stage:'listen',helpSub:0,selfLevel:null,path:null,myAnswer:'',quizFills:[],quizChecked:false,aiScript:null}); generateDialogue(); };
  document.getElementById('againBtn').onclick=()=>{ S.turn=0;S.stage='listen';S.helpSub=0;S.selfLevel=null;S.path=null;S.myAnswer='';S.quizFills=[];S.quizChecked=false; renderTurn(); };
  document.getElementById('homeBtn').onclick=exitSession;
}

// ============ INIT ============
renderAccents(); renderModules(); renderScns(); renderAccents(); syncSel(); updateStreakUI(); renderStats();
document.getElementById('startBtn').onclick=startSession;
document.getElementById('exitBtn').onclick=exitSession;
</script>
